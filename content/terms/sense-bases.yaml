      refEnd: T31n1612_p0848b16
      note_en: What is the tongue faculty? Clear matter whose object is taste.
  related: [ rasa, jihva-vijnana ]

- id: kaya
  skt: kāya
  deva: काय
  pali: kāya
  zh: 身
  zhAlt: [ 身根, 身處, 身界 ]
  en: body
  enAlt: [ body faculty, tactile faculty, body sense, touch faculty ]
  root: √ci「積聚」→「身體」 · "body, accumulation"
  short_zh: 身根：以所觸為境的清淨色，遍布全身；身識的所依。
  short_en: The body faculty — clear matter whose object is the tangible, spread through the whole body; the support of body-consciousness.
  detail_zh: |
    《大乘五蘊論》：「云何身根？謂所觸為境清淨色。」身根遍於全身，感知冷暖、滑澀、輕重等觸。

    **「身」字多義**：身根（kāya-indriya）是感官；身業的「身」指身體行為；「身識」是依身根的識；經中「身證」的「身」又有「親身」之義。讀經時要看上下文。
  detail_en: |
    Pañcaskandhaka: "What is the body faculty? Clear matter whose object is the tangible." It pervades the whole body, sensing cold and warmth, smoothness and roughness, heaviness and lightness.

    **Many senses of 身/kāya**: the body faculty is a sense faculty; in "bodily karma" it means physical action; body-consciousness is consciousness based on the body faculty; in "realizing with the body" it means "in person". Read the context.
  quotes:
    - text: 云何身根？謂所觸為境清淨色。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0848b16
      note_en: What is the body faculty? Clear matter whose object is the tangible.
  related: [ sprastavya, kaya-vijnana ]

- id: manas
  skt: manas
  deva: मनस्
  pali: mano
  zh: 意
  zhAlt: [ 意根, 意處, 意界 ]
  en: mental faculty
  enAlt: [ mind, mind faculty, intellect, mind base, mind element, mentation ]
  root: √man「思量」 · √man "to think"
  short_zh: 意根：第六意識的所依。有部以前一剎那剛滅的識為意；唯識以第七末那識為意根。
  short_en: The mental faculty — the support of the sixth, mental consciousness. For the Sarvāstivāda it is the consciousness just ceased; for Yogācāra it is the seventh consciousness, manas.
  detail_zh: |
    意根是第六意識的所依，但它不是色法，所以與眼等五根不同。各派對「意根是什麼」看法不同：

    - **說一切有部**：《俱舍論》：「由即六識身，無間滅為意。」任何一識在剛滅去的下一剎那，成為後一識的所依，就叫意（意界）。
    - **唯識**：意識需要一個恆常的「俱有依」，這就是第七末那識；所以唯識所說的意根即末那識。

    **名稱陷阱**：「意」（manas）、「意識」（mano-vijñāna）、「末那識」（kliṣṭa-manas，音譯「末那」即 manas）三者極易混淆——詳見比較卡。
  detail_en: |
    The mental faculty is the support of the sixth consciousness, but it is not matter, unlike the five sense faculties. Schools differ on what it is:

    - **Sarvāstivāda**: Abhidharmakośa: "Any of the six consciousnesses, having just ceased, is manas." Whatever consciousness has just passed becomes the support of the next — the mind element.
    - **Yogācāra**: the mental consciousness needs a constant simultaneous support, which is the seventh consciousness; so the Yogācāra mental faculty is manas.

    **Naming trap**: manas (意), mano-vijñāna (意識) and the seventh consciousness (末那識, 末那 being a transliteration of manas) are easily confused — see the comparison card.
  quotes:
    - text: 由即六識身，無間滅為意。
      source: 《阿毘達磨俱舍論》卷1
      source_en: Abhidharmakośabhāṣya, fasc. 1
      ref: T29n1558_p0004b03
      note_en: Any of the six bodies of consciousness, having just ceased, is manas.
    - text: 言意界者，謂即彼無間滅等，為欲顯示第六意識，及廣建立十八界故。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0850b01
      refEnd: T31n1612_p0850b03
      note_en: The mind element is [consciousness] that has just ceased, etc.; [it is named] in order to show the sixth, mental consciousness and to establish the eighteen elements fully.
  related: [ mano-vijnana, klista-manas, citta ]
  compare: [ manas-three ]

# ---------------- 六境 ----------------

- id: rupayatana
  skt: rūpāyatana
  deva: रूपायतन
  pali: rūpāyatana
  zh: 色境
  zhAlt: [ 色處, 色塵, 色界 ]
  en: visible form
  enAlt: [ visible object, visual object, visible forms, colour and shape, color and shape, sight object, form object ]
  root: rūpa「色」＋ āyatana「處」 · rūpa "form" + āyatana "base"
  short_zh: 眼所見的對象：顯色（青黃赤白等）、形色（長短方圓等）與表色。不同於作為五蘊之一的「色」。
  short_en: The object of the eye — colour, shape and bodily expression. Not the same as rūpa the aggregate.
  detail_zh: |
    《大乘五蘊論》：「云何為色？謂眼境界，顯色、形色及表色等。」顯色是青、黃、赤、白及光影明暗；形色是長、短、方、圓等；表色是身體動作所表現的形態。

    **最重要的分辨**：同一個「色」字，作為**色蘊**是一切物質（包括五根、五境、無表色）；作為**色處／色境**只是眼所見的對象。所以「色處」只是「色蘊」中的一小部分。詳見比較卡「色蘊與色處」。

    注意十八界的「色界」與三界的「色界」（rūpadhātu，色界天）也是完全不同的東西。
  detail_en: |
    Pañcaskandhaka: "What is visible form? The domain of the eye — colour, shape, bodily expression and so on." Colour is blue, yellow, red, white, light and shade; shape is long, short, square, round; expression is the configuration shown by bodily action.

    **The key distinction**: the same word rūpa as the **form aggregate** means all matter (the five faculties, five objects, unmanifest form); as the **visible-form base** it means only what the eye sees. The visible-form base is a small part of the form aggregate. See the comparison card.

    Note also that the "form element" (色界) of the eighteen elements has nothing to do with the "form realm" (rūpadhātu) of the three realms.
  quotes:
    - text: 云何為色？謂眼境界，顯色、形色及表色等。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0848b16
      refEnd: T31n1612_p0848b17
      note_en: What is visible form? The domain of the eye — colour, shape, bodily expression and so on.
  related: [ rupa, caksus, visaya ]
  compare: [ rupa-skandha-ayatana ]

- id: sabda
  skt: śabda
  deva: शब्द
  pali: sadda
  zh: 聲
  zhAlt: [ 聲境, 聲處, 聲塵 ]
  en: sound
  enAlt: [ sounds, sound object, auditory object ]
  root: 「聲音、語詞」 · "sound, word"
  short_zh: 耳所聞的對象。依發聲的四大是否為有情所執受，分三類。
  short_en: The object of the ear, classed by whether the elements producing it are appropriated by a sentient being.
  detail_zh: |
    《大乘五蘊論》：「云何為聲？謂耳境界，執受大種因聲，非執受大種因聲，俱大種因聲。」執受大種因聲是有情身體發出的聲音（如說話），非執受大種因聲是無情物的聲音（如風、水），俱大種因聲是兩者共同產生的（如擊鼓）。

    śabda 也有「語詞」之義——印度哲學中聲常住論（聲是永恆的）是佛教所批判的觀點之一。
  detail_en: |
    Pañcaskandhaka: "What is sound? The domain of the ear — sound caused by appropriated elements, by unappropriated elements, and by both." Appropriated: produced by a living body (speech); unappropriated: by insentient things (wind, water); both: e.g. a hand striking a drum.

    Śabda also means "word"; the Indian doctrine that sound (the Vedic word) is eternal is one of the views Buddhism criticizes.
  quotes:
    - text: 云何為聲？謂耳境界，執受大種因聲，非執受大種因聲，俱大種因聲。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0848b17
      refEnd: T31n1612_p0848b19
      note_en: What is sound? The domain of the ear — sound caused by appropriated great elements, sound caused by unappropriated great elements, and sound caused by both.
  related: [ srotra, srotra-vijnana ]

- id: gandha
  skt: gandha
  deva: गन्ध
  pali: gandha
  zh: 香
  zhAlt: [ 香境, 香處, 香塵 ]
  en: smell
  enAlt: [ odour, odor, scent, smells, olfactory object ]
  root: 「氣味」 · "smell, fragrance"
  short_zh: 鼻所嗅的對象：好香、惡香及其餘之香。
  short_en: The object of the nose — pleasant, unpleasant and other smells.
  detail_zh: |
    《大乘五蘊論》：「云何為香？謂鼻境界，好香、惡香、及所餘香。」漢譯的「香」泛指一切氣味，不單指香氣，臭味也是「香境」。
  detail_en: |
    Pañcaskandhaka: "What is smell? The domain of the nose — pleasant smells, unpleasant smells and other smells." Chinese 香 here covers all odours, not just fragrance; a stench is also a "香境".
  quotes:
    - text: 云何為香？謂鼻境界，好香、惡香、及所餘香。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0848b19
      refEnd: T31n1612_p0848b20
      note_en: What is smell? The domain of the nose — pleasant, unpleasant and other smells.
  related: [ ghrana, ghrana-vijnana ]

- id: rasa
  skt: rasa
  deva: रस
  pali: rasa
  zh: 味
  zhAlt: [ 味境, 味處, 味塵 ]
  en: taste
  enAlt: [ flavour, flavor, tastes, gustatory object ]
  root: 「汁液、滋味」 · "juice, flavour"
  short_zh: 舌所嘗的對象：甘、酢、醎、辛、苦、淡六味。
  short_en: The object of the tongue — sweet, sour, salty, pungent, bitter and bland.
  detail_zh: |
    《大乘五蘊論》：「云何為味？謂舌境界，甘味、酢味、醎味、辛味、苦味、淡味。」

    rasa 在印度美學中也指「情味」（藝術感受）；在佛典中也常比喻法的滋味——「法味」「解脫味」，如南傳《增支部》（AN 8.19）說：大海唯一鹹味，此法與律唯一解脫味。
  detail_en: |
    Pañcaskandhaka: "What is taste? The domain of the tongue — sweet, sour, salty, pungent, bitter and bland."

    Rasa is also "aesthetic flavour" in Indian poetics, and in the sūtras a metaphor for the taste of the Dharma — as the ocean has one taste, salt, so this Dharma and discipline has one taste, liberation (Aṅguttara Nikāya 8.19).
  quotes:
    - text: 云何為味？謂舌境界，甘味、酢味、醎味、辛味、苦味、淡味。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0848b20
      refEnd: T31n1612_p0848b21
      note_en: What is taste? The domain of the tongue — sweet, sour, salty, pungent, bitter and bland tastes.
  related: [ jihva, jihva-vijnana ]

- id: sprastavya
  skt: spraṣṭavya
  deva: स्प्रष्टव्य
  pali: phoṭṭhabba
  zh: 觸境
  zhAlt: [ 觸, 所觸, 觸處, 觸塵 ]
  en: tangible
  enAlt: [ tangible object, tangibles, the tangible, tactile object, touch object ]
  root: √spṛś 的未來被動分詞「應被觸的」 · gerundive of √spṛś, "to be touched"
  short_zh: 身所觸的對象：四大種及滑、澀、重、輕、冷、飢、渴等。注意與心所「觸」（sparśa）不同。
  short_en: The object of the body — the four elements and smoothness, roughness, heaviness, lightness, cold, hunger, thirst. Not the mental factor contact (sparśa).
  detail_zh: |
    《大乘五蘊論》：「云何為所觸一分？謂身境界，除四大種餘所造觸，滑性、澁性、重性、輕性、冷、飢、渴等。」又說「言觸處者，謂四大種及前所說所觸一分」——觸處包括能造的四大本身（堅、濕、煖、動）與所造觸。

    **易混淆**：漢譯都作「觸」，但**觸境**（spraṣṭavya，「所觸」）是色法，是身根的對象；**觸心所**（sparśa）是遍行心所，是根境識三和合。兩者一屬色蘊，一屬行蘊（見比較卡）。
  detail_en: |
    Pañcaskandhaka: "What is part of the tangible? The domain of the body — derived tangibles other than the four elements: smoothness, roughness, heaviness, lightness, cold, hunger, thirst and so on." And: "the tangible base is the four elements and the part of the tangible just described" — it includes the elements themselves (solidity, cohesion, heat, motion) and derived tangibles.

    **Easily confused**: Chinese uses 觸 for both, but the **tangible** (spraṣṭavya, "what is to be touched") is matter, the object of the body faculty; **contact** (sparśa) is an omnipresent mental factor, the meeting of faculty, object and consciousness. One is in the form aggregate, the other in formations (see the comparison card).
  quotes:
    - text: 云何為所觸一分？謂身境界，除四大種餘所造觸，滑性、澁性、重性、輕性、冷、飢、渴等。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0848b22
      refEnd: T31n1612_p0848b23
      note_en: 'What is part of the tangible? The domain of the body — derived tangibles other than the four great elements: smoothness, roughness, heaviness, lightness, cold, hunger, thirst and so on.'
    - text: 言觸處者，謂四大種及前所說所觸一分。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0850a15
      refEnd: T31n1612_p0850a16
      note_en: The tangible base means the four great elements and the part of the tangible described before.
  related: [ kaya, sparsa, kaya-vijnana ]
  compare: [ sparsa-sprastavya ]

- id: dharmayatana
  skt: dharmāyatana
  deva: धर्मायतन
  pali: dhammāyatana
  zh: 法處
  zhAlt: [ 法境, 法界, 法塵, 法 ]
  en: mental object
  enAlt: [ mental objects, mind object, dharma base, dharma-base, dharmas, phenomena, mental-object base ]
  root: dharma「法」＋ āyatana「處」 · dharma + āyatana "base"
  short_zh: 意所緣的對象：受、想、行三蘊、無表色與無為法等，五根五境以外的一切法。
  short_en: 'The object of the mind — feeling, perception, formations, unmanifest form, the unconditioned: every dharma outside the five faculties and five objects.'
  detail_zh: |
    《大乘五蘊論》：「言法處者，謂受想行蘊、無表色等及與無為。」法處是「剩餘」的一類：凡不屬於眼等五根、色等五境、意（識蘊）的一切法，都歸入法處——包括心所、心不相應行、無表色，以及虛空、擇滅、非擇滅、真如等無為法。

    **「法」字的陷阱**：法處的「法」只是十二處之一；「一切法」的「法」卻是十二處全部。作為十八界之一的「法界」也不同於華嚴等所說的「法界」（dharmadhātu，真如法界）。
  detail_en: |
    Pañcaskandhaka: "The dharma base is the feeling, perception and formations aggregates, unmanifest form and so on, and the unconditioned." It is the "remainder" category: every dharma not among the five sense faculties, five objects or mind (the consciousness aggregate) — mental factors, non-associated formations, unmanifest form, and the unconditioned (space, the two cessations, suchness).

    **The 法 trap**: the dharma of "dharma base" is one of twelve bases; the dharma of "all dharmas" is all twelve. And the "dharma element" among the eighteen is different from the Huayan "dharma-realm" (dharmadhātu, suchness).
  quotes:
    - text: 言法處者，謂受想行蘊無表色等及與無為。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0850a17
      note_en: The dharma base means the feeling, perception and formations aggregates, unmanifest form, etc., and the unconditioned.
  related: [ manas, mano-vijnana, nirvana ]
  compare: [ skandha-ayatana-dhatu ]
