  short_zh: 耳根：以聲為境的清淨色；耳識的所依。
  short_en: The ear faculty — clear matter whose object is sound; the support of ear-consciousness.
  detail_zh: |
    《大乘五蘊論》：「云何耳根？謂聲為境清淨色。」與眼根同樣是微細的淨色根。耳根、聲、耳識和合而有聞。
  detail_en: |
    Pañcaskandhaka: "What is the ear faculty? Clear matter whose object is sound." Like the eye, a subtle faculty of clear matter; ear faculty, sound and ear-consciousness together make hearing.
  quotes:
    - text: 云何耳根？謂聲為境清淨色。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0848b14
      note_en: What is the ear faculty? Clear matter whose object is sound.
  related: [ sabda, srotra-vijnana ]

- id: ghrana
  skt: ghrāṇa
  deva: घ्राण
  pali: ghāna
  zh: 鼻
  zhAlt: [ 鼻根, 鼻處, 鼻界 ]
  en: nose
  enAlt: [ nose faculty, olfactory faculty, nose sense, nose organ ]
  root: √ghrā「嗅」 · √ghrā "to smell"
  short_zh: 鼻根：以香為境的清淨色；鼻識的所依。
  short_en: The nose faculty — clear matter whose object is smell; the support of nose-consciousness.
  detail_zh: |
    《大乘五蘊論》：「云何鼻根？謂香為境清淨色。」

    值得注意：色界天人沒有段食，所以不起鼻識、舌識——五蘊論說十八界中色界繫者十四，「除香、味，鼻、舌識」。
  detail_en: |
    Pañcaskandhaka: "What is the nose faculty? Clear matter whose object is smell."

    Note: beings of the form realm take no coarse food, so nose- and tongue-consciousness do not arise there — the Pañcaskandhaka says fourteen of the eighteen elements belong to the form realm, "excluding smell, taste, and nose- and tongue-consciousness".
  quotes:
    - text: 云何鼻根？謂香為境清淨色。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0848b14
      refEnd: T31n1612_p0848b15
      note_en: What is the nose faculty? Clear matter whose object is smell.
  related: [ gandha, ghrana-vijnana ]

- id: jihva
  skt: jihvā
  deva: जिह्वा
  pali: jivhā
  zh: 舌
  zhAlt: [ 舌根, 舌處, 舌界 ]
  en: tongue
  enAlt: [ tongue faculty, gustatory faculty, taste faculty, tongue organ ]
  root: 「舌」 · "tongue"
  short_zh: 舌根：以味為境的清淨色；舌識的所依。
  short_en: The tongue faculty — clear matter whose object is taste; the support of tongue-consciousness.
  detail_zh: |
    《大乘五蘊論》：「云何舌根？謂味為境清淨色。」五蘊論列六種味：甘、酢（酸）、醎（鹹）、辛、苦、淡。
  detail_en: |
    Pañcaskandhaka: "What is the tongue faculty? Clear matter whose object is taste." It lists six tastes: sweet, sour, salty, pungent, bitter and bland.
  quotes:
    - text: 云何舌根？謂味為境清淨色。
