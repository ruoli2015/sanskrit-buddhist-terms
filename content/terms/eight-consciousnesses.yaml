# 八識 (唯識)

- id: caksur-vijnana
  skt: cakṣur-vijñāna
  deva: चक्षुर्विज्ञान
  pali: cakkhuviññāṇa
  zh: 眼識
  zhAlt: [ 眼識界, 眼識身 ]
  en: eye-consciousness
  enAlt: [ eye consciousness, visual consciousness, seeing consciousness ]
  root: cakṣus「眼」＋ vijñāna「識」 · cakṣus "eye" + vijñāna "consciousness"
  short_zh: 依眼根、緣色境而了別的識；前五識之一。
  short_en: Consciousness that discerns visible form, based on the eye faculty; one of the five sense consciousnesses.
  detail_zh: |
    眼識依眼根、緣色境而生，了別青黃長短等色相。它是「前五識」之一，屬第三能變（了境為性相）。

    **依根得名**：識以其所依之根命名，而不以所緣之境命名——稱「眼識」不稱「色識」，因為根是識的「不共依」，且根壞則識不生。

    前五識只緣現在的、具體的境（現量），不能回憶過去或推想未來；分別、判斷要靠同時生起的第六意識。《唯識三十頌》：「依止根本識，五識隨緣現，或俱或不俱，如濤波依水。」
  detail_en: |
    Eye-consciousness arises based on the eye faculty and taking visible form, discerning colour and shape. It is one of the "first five" sense consciousnesses, belonging to the third transformation ("discerning objects is its nature and characteristic").

    **Named after its faculty**: consciousness is named after the faculty that supports it, not the object it takes — "eye-consciousness", not "form-consciousness" — since the faculty is its exclusive support and when the faculty is damaged the consciousness does not arise.

    The five sense consciousnesses cognize only present, concrete objects (direct perception); remembering, judging and conceptualizing need the sixth, mental consciousness arising with them. Thirty Verses: "Based on the root consciousness, the five consciousnesses appear according to conditions, sometimes together, sometimes not, like waves on water."
  quotes:
    - text: 依止根本識，五識隨緣現，或俱或不俱，如濤波依水。
      source: 《唯識三十論頌》
      source_en: Triṃśikā (Thirty Verses)
      ref: T31n1586_p0060c05
      refEnd: T31n1586_p0060c06
      note_en: Based on the root consciousness, the five consciousnesses manifest according to conditions, sometimes together and sometimes not, like waves depending on water.
    - text: 如是緣眼、色，生眼識，三事和合觸，觸俱生受、想、思。
      source: 《雜阿含經》卷11（第273經）
      source_en: Saṃyuktāgama, fasc. 11, sūtra 273
      ref: T02n0099_p0072c09
      refEnd: T02n0099_p0072c10
      note_en: Thus, conditioned by eye and form, eye-consciousness arises; the meeting of the three is contact; together with contact arise feeling, perception and volition.
  related: [ caksus, rupayatana, vijnana ]
  compare: [ vijnana-senses ]

- id: srotra-vijnana
  skt: śrotra-vijñāna
  deva: श्रोत्रविज्ञान
  pali: sotaviññāṇa
  zh: 耳識
  zhAlt: [ 耳識界, 耳識身 ]
  en: ear-consciousness
  enAlt: [ ear consciousness, auditory consciousness, hearing consciousness ]
  root: śrotra「耳」＋ vijñāna「識」 · śrotra "ear" + vijñāna
  short_zh: 依耳根、緣聲境而了別的識；前五識之一。
  short_en: Consciousness that discerns sound, based on the ear faculty; one of the five sense consciousnesses.
  detail_zh: |
    耳識依耳根、緣聲境而生。與其他前五識一樣，只能了別當下的聲音本身；辨認「這是鐘聲」「這是某人在叫我」則是與之同時的意識的作用。
  detail_en: |
    Ear-consciousness arises based on the ear faculty and taking sound. Like the other sense consciousnesses it discerns only the present sound itself; recognizing "that's a bell" or "someone is calling me" is the work of the mental consciousness arising with it.
  quotes:
    - text: 第一心法，略有八種：一眼識、二耳識、三鼻識、四舌識、五身識、六意識、七末那識、八阿賴耶識。
      source: 《大乘百法明門論》
      source_en: Mahāyāna Hundred Dharmas Treatise
      ref: T31n1614_p0855b20
      refEnd: T31n1614_p0855b22
      note_en: 'First, the mind dharmas, briefly eight: 1 eye-consciousness, 2 ear-consciousness, 3 nose-consciousness, 4 tongue-consciousness, 5 body-consciousness, 6 mental consciousness, 7 manas consciousness, 8 ālaya consciousness.'
  related: [ srotra, sabda ]
  compare: [ vijnana-senses ]

- id: ghrana-vijnana
  skt: ghrāṇa-vijñāna
  deva: घ्राणविज्ञान
  pali: ghānaviññāṇa
  zh: 鼻識
  zhAlt: [ 鼻識界, 鼻識身 ]
  en: nose-consciousness
  enAlt: [ nose consciousness, olfactory consciousness, smelling consciousness ]
  root: ghrāṇa「鼻」＋ vijñāna「識」 · ghrāṇa "nose" + vijñāna
  short_zh: 依鼻根、緣香境而了別的識；前五識之一。色界以上不起。
  short_en: Consciousness that discerns smell, based on the nose faculty; absent in the form realm and above.
  detail_zh: |
    鼻識依鼻根、緣香境而生。色界、無色界眾生無段食，所以鼻識與舌識不起——這也是十八界中色界繫者只有十四界的原因。
  detail_en: |
    Nose-consciousness arises based on the nose faculty and taking smell. Beings of the form and formless realms take no coarse food, so nose- and tongue-consciousness do not arise there — hence only fourteen of the eighteen elements belong to the form realm.
  quotes:
    - text: 第一心法，略有八種：一眼識、二耳識、三鼻識、四舌識、五身識、六意識、七末那識、八阿賴耶識。
      source: 《大乘百法明門論》
      source_en: Mahāyāna Hundred Dharmas Treatise
      ref: T31n1614_p0855b20
      refEnd: T31n1614_p0855b22
      note_en: 'First, the mind dharmas, briefly eight: eye-, ear-, nose-, tongue-, body-consciousness, mental consciousness, manas consciousness, ālaya consciousness.'
  related: [ ghrana, gandha ]
  compare: [ vijnana-senses ]

- id: jihva-vijnana
  skt: jihvā-vijñāna
  deva: जिह्वाविज्ञान
  pali: jivhāviññāṇa
  zh: 舌識
  zhAlt: [ 舌識界, 舌識身 ]
  en: tongue-consciousness
  enAlt: [ tongue consciousness, gustatory consciousness, tasting consciousness ]
  root: jihvā「舌」＋ vijñāna「識」 · jihvā "tongue" + vijñāna
  short_zh: 依舌根、緣味境而了別的識；前五識之一。色界以上不起。
  short_en: Consciousness that discerns taste, based on the tongue faculty; absent in the form realm and above.
  detail_zh: |
    舌識依舌根、緣味境而生。與鼻識一樣只存在於欲界。
  detail_en: |
    Tongue-consciousness arises based on the tongue faculty and taking taste. Like nose-consciousness, it exists only in the desire realm.
  quotes:
    - text: 第一心法，略有八種：一眼識、二耳識、三鼻識、四舌識、五身識、六意識、七末那識、八阿賴耶識。
      source: 《大乘百法明門論》
      source_en: Mahāyāna Hundred Dharmas Treatise
      ref: T31n1614_p0855b20
      refEnd: T31n1614_p0855b22
      note_en: 'First, the mind dharmas, briefly eight: eye-, ear-, nose-, tongue-, body-consciousness, mental consciousness, manas consciousness, ālaya consciousness.'
  related: [ jihva, rasa ]
  compare: [ vijnana-senses ]

- id: kaya-vijnana
  skt: kāya-vijñāna
  deva: कायविज्ञान
  pali: kāyaviññāṇa
  zh: 身識
  zhAlt: [ 身識界, 身識身 ]
  en: body-consciousness
  enAlt: [ body consciousness, tactile consciousness, touch consciousness ]
  root: kāya「身」＋ vijñāna「識」 · kāya "body" + vijñāna
  short_zh: 依身根、緣觸境而了別的識；前五識之一。
  short_en: Consciousness that discerns the tangible, based on the body faculty; one of the five sense consciousnesses.
  detail_zh: |
    身識依身根、緣觸境而生，了別冷暖、軟硬、輕重等。身體的苦樂受多與身識相應。
  detail_en: |
    Body-consciousness arises based on the body faculty and taking tangibles, discerning cold and warmth, soft and hard, light and heavy. Bodily pain and pleasure mostly accompany body-consciousness.
  quotes:
    - text: 第一心法，略有八種：一眼識、二耳識、三鼻識、四舌識、五身識、六意識、七末那識、八阿賴耶識。
      source: 《大乘百法明門論》
      source_en: Mahāyāna Hundred Dharmas Treatise
      ref: T31n1614_p0855b20
      refEnd: T31n1614_p0855b22
      note_en: 'First, the mind dharmas, briefly eight: eye-, ear-, nose-, tongue-, body-consciousness, mental consciousness, manas consciousness, ālaya consciousness.'
  related: [ kaya, sprastavya ]
  compare: [ vijnana-senses ]

- id: mano-vijnana
  skt: mano-vijñāna
  deva: मनोविज्ञान
  pali: manoviññāṇa
  zh: 意識
  zhAlt: [ 第六識, 第六意識, 意識界, 意識身 ]
  en: mental consciousness
  enAlt: [ mind consciousness, mind-consciousness, sixth consciousness, mental-consciousness ]
  root: manas「意」＋ vijñāna「識」 · manas "mind" + vijñāna
  short_zh: 第六識：依意根、緣一切法而了別；能分別、回憶、推想，除五種位外常現起。
  short_en: The sixth consciousness — based on the mental faculty, taking all dharmas as object; it conceptualizes, remembers and reasons, and is almost always active.
  detail_zh: |
    意識依意根、緣法境——實際上能緣一切法，過去、現在、未來，具體或抽象。前五識只能「看見、聽見」，意識才能說出「這是什麼」「好不好」。善惡業主要由意識發動，所以修行最直接處理的是意識。

    **五位無心**：《唯識三十頌》：「意識常現起，除生無想天，及無心二定，睡眠與悶絕。」意識幾乎總在，只有在無想天、無想定、滅盡定、極重睡眠與悶絕這五種情況下中斷。

    **名稱**：「意識」是「依意（根）之識」，與「意」（意根）不同；也不是第七末那識（詳見比較卡）。
  detail_en: |
    The mental consciousness is based on the mental faculty and takes mental objects — in fact any dharma, past, present or future, concrete or abstract. The five sense consciousnesses only "see" and "hear"; the mental consciousness says "what it is" and "whether it is good". Good and evil karma is mainly initiated by it, so practice works most directly on it.

    **Five mindless states**: Thirty Verses: "The mental consciousness is always arising, except when born among the non-perceiving gods, in the two mindless attainments, in deep sleep and in fainting." It is interrupted only in those five situations.

    **Name**: mano-vijñāna is "consciousness based on manas", distinct from manas (the mental faculty) and from the seventh consciousness (see the comparison card).
  quotes:
    - text: 意識常現起，除生無想天，及無心二定，睡眠與悶絕。
      source: 《唯識三十論頌》
      source_en: Triṃśikā (Thirty Verses)
      ref: T31n1586_p0060c07
      refEnd: T31n1586_p0060c08
      note_en: The mental consciousness always arises, except when born among the non-perceiving gods, in the two mindless attainments, in [dreamless] sleep and in fainting.
    - text: 六識界者，謂依眼等根、緣色等境，了別為性。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0850a29
      refEnd: T31n1612_p0850b01
      note_en: The six consciousness elements, based on the eye and the other faculties and taking form and the other objects, have discerning as their nature.
  related: [ manas, klista-manas, vijnana ]
  compare: [ manas-three, vijnana-senses ]

- id: klista-manas
  skt: kliṣṭa-manas
  deva: क्लिष्टमनस्
  pali: ''
  zh: 末那識
  zhAlt: [ 末那, 第七識, 染污意, 意根 ]
  en: afflicted mind
  enAlt: [ defiled mind, manas, seventh consciousness, afflicted mentation, afflicted consciousness ]
  root: kliṣṭa「染污的」＋ manas「意」；「末那」即 manas 音譯 · kliṣṭa "afflicted" + manas
  short_zh: 第七識：恆緣第八阿賴耶識執以為我，恆與我癡、我見、我慢、我愛四煩惱相應；是我執的根源。
  short_en: The seventh consciousness — constantly taking the eighth (ālaya) as a self, always accompanied by self-delusion, self-view, self-pride and self-love; the root of self-grasping.
  detail_zh: |
    《唯識三十頌》：「次第二能變，是識名末那，依彼轉緣彼，思量為性相，四煩惱常俱，謂我癡、我見，并我慢、我愛。」

    末那識「依彼轉緣彼」——依阿賴耶識而轉，又以阿賴耶識為所緣，把它執為「我」。它的特性是「恆、審思量」：恆時不斷、審細地思量「我」——即使在深度睡眠、無想定中，這種潛在的我執也不中斷。第六意識的我執時有時無，末那識的我執卻是恆常的，所以是**俱生我執**的根本。

    末那屬「有覆無記」：有我執覆蔽（有覆），但不造善惡業（無記）。《三十頌》說它在「阿羅漢、滅定、出世道」中不起。唯識學以末那識為第六意識的所依「意根」。
  detail_en: |
    Thirty Verses: "Next, the second transformation: this consciousness is called manas; it depends on that [ālaya] and takes it as object; deliberation is its nature and characteristic; four afflictions always accompany it — self-delusion, self-view, self-pride and self-love."

    Manas "depends on that and takes that as object": it operates based on the ālaya and grasps the ālaya as "self". Its mark is "constant and intent deliberation": ceaselessly and subtly construing a self — even in dreamless sleep or the non-perceptual attainment this latent self-grasping continues. The sixth consciousness's self-grasping comes and goes; that of manas is constant, so it is the root of **innate self-grasping**.

    Manas is "obscured-neutral": veiled by self-grasping, yet not producing good or evil karma. The Thirty Verses say it is absent in arhats, in the attainment of cessation and on the transcendent path. Yogācāra treats it as the mental faculty (意根) that supports the sixth consciousness.
  quotes:
    - text: 次第二能變，是識名末那，依彼轉緣彼，思量為性相。四煩惱常俱，謂我癡、我見、并我慢、我愛
      source: 《唯識三十論頌》
      source_en: Triṃśikā (Thirty Verses)
      ref: T31n1586_p0060b10
      refEnd: T31n1586_p0060b13
      note_en: 'Next is the second transformation: this consciousness is called manas. It depends on that and takes that as object; deliberation is its nature and characteristic. Four afflictions always accompany it: self-delusion, self-view, self-pride and self-love.'
    - text: 最勝意者，謂緣阿賴耶識為境，恒與我癡、我見、我慢及我愛等相應之識，前後一類相續隨轉，除阿羅漢果及與聖道滅盡等至現在前位。
      source: 《大乘五蘊論》
      source_en: Pañcaskandhaka
      ref: T31n1612_p0850a07
      refEnd: T31n1612_p0850a10
      note_en: The supreme manas is the consciousness that takes the ālaya consciousness as object and is constantly accompanied by self-delusion, self-view, self-pride, self-love and so on, continuing uniformly moment after moment — except in the state of arhatship, and when the noble path or the attainment of cessation is present.
  related: [ alaya-vijnana, manas, mana ]
  compare: [ manas-three ]

- id: alaya-vijnana
  skt: ālaya-vijñāna
  deva: आलयविज्ञान
  pali: ''
  zh: 阿賴耶識
  zhAlt: [ 阿賴耶, 第八識, 藏識, 阿陀那識, 異熟識, 種子識 ]
  en: storehouse consciousness
  enAlt: [ store consciousness, store-house consciousness, storehouse-consciousness, eighth consciousness, foundation consciousness, repository consciousness, alaya consciousness, ālaya ]
  root: 'ā-√lī「安住、依附、倉庫」 · ā-√lī "to cling, settle": abode, store'
  short_zh: 第八識：攝藏一切種子，執持根身，變現器世界；能藏、所藏、執藏。恆轉如瀑流，阿羅漢位捨其名。
  short_en: The eighth consciousness — storing all seeds, sustaining the body, manifesting the world; it stores, is stored in, and is clung to as self. It flows on like a torrent; the name is dropped at arhatship.
  detail_zh: |
    ālaya 意為「倉庫、住處」。《成唯識論》說阿賴耶具**三藏義**：
    - **能藏**：攝藏一切法的種子；
    - **所藏**：被前七識所熏習的種子藏入其中；
    - **執藏**：被第七末那識執為自我。

    《唯識三十頌》：「初阿賴耶識，異熟一切種……恒轉如瀑流，阿羅漢位捨。」它是業果的「異熟」主體（異熟識），也是一切種子的所依（一切種）；念念生滅、相續不斷，像瀑流一樣——非常非斷，因此不是「我」。

    **異名**：又稱阿陀那識（ādāna，「執持」，執持根身與種子）。《解深密經》：「阿陀那識甚深細，一切種子如瀑流，我於凡愚不開演，恐彼分別執為我。」到阿羅漢位，末那不再執之為我，「阿賴耶」之名便捨，但異熟識體仍在；成佛時轉為大圓鏡智。
  detail_en: |
    Ālaya means "storehouse, abode". The Cheng weishi lun gives it **three senses of storing**:
    - **storing**: it holds the seeds of all dharmas;
    - **being stored in**: the seeds imprinted by the other seven consciousnesses are stored in it;
    - **being clung to**: it is grasped as self by the seventh consciousness.

    Thirty Verses: "First, the ālaya consciousness, the resultant, bearing all seeds … it flows on constantly like a torrent, and is relinquished at arhatship." It is the subject of karmic maturation (the "resultant consciousness") and the support of all seeds; arising and ceasing each moment in unbroken continuity like a torrent — neither permanent nor annihilated, hence not a self.

    **Other names**: also called ādāna-vijñāna, "the appropriating consciousness" (holding the body and seeds). Saṃdhinirmocana: "The ādāna consciousness is profound and subtle; all its seeds flow like a torrent. I do not teach it to the foolish, lest they imagine it and grasp it as a self." At arhatship, manas no longer grasps it as self and the name "ālaya" is dropped, though the resultant consciousness continues; at buddhahood it is transformed into mirror-like wisdom.
  quotes:
    - text: 初阿賴耶識，異熟一切種，不可知執受，處了常與觸、作意、受、想、思，相應唯捨受。是無覆無記，觸等亦如是，恒轉如瀑流，阿羅漢位捨。
      source: 《唯識三十論頌》
      source_en: Triṃśikā (Thirty Verses)
      ref: T31n1586_p0060b04
      refEnd: T31n1586_p0060b08
      note_en: 'First is the ālaya consciousness: the resultant, bearing all seeds; its appropriation, place and discernment are imperceptible; it is always associated with contact, attention, feeling, perception and volition, and only with neutral feeling; it is unobscured and neutral, and so are contact and the rest; it flows on constantly like a torrent, and is relinquished at arhatship.'
    - text: 具有能藏、所藏、執藏義故。
      source: 《成唯識論》卷2
      source_en: Cheng weishi lun, fasc. 2
      ref: T31n1585_p0007c21
      note_en: Because it has the senses of storing, being stored in, and being clung to.
    - text: 阿陀那識甚深細，一切種子如瀑流，我於凡愚不開演，恐彼分別執為我。
      source: 《解深密經》卷1
      source_en: Saṃdhinirmocana-sūtra, fasc. 1
      ref: T16n0676_p0692c22
      refEnd: T16n0676_p0692c23
      note_en: The ādāna consciousness is profound and subtle; all its seeds flow like a torrent. I do not reveal it to the foolish, lest they imagine it and grasp it as a self.
  related: [ klista-manas, citta, karma ]
  compare: [ manas-three ]
