# Lists (term groups). Order here = order in which new terms are introduced.
# `head` is the term that names the list; `items` are its members (in canonical order when `ordered: true`).

- id: five-aggregates
  zh: 五蘊
  en: The Five Aggregates
  skt: pañca skandhāḥ
  head: skandha
  items: [rupa, vedana, samjna, samskara, vijnana]
  ordered: true
  summary_zh: 佛陀將有情身心分析為色、受、想、行、識五類聚合，以顯示其中無我。五蘊總攝一切有為法。
  summary_en: The Buddha's analysis of a person into five groups — form, feeling, perception, formations, consciousness — to show that none of them is a self. Together they cover all conditioned dharmas.

- id: sarvatraga
  zh: 五遍行心所
  en: The Five Omnipresent Mental Factors
  skt: pañca sarvatragāḥ
  head: sarvatraga
  items: [manaskara, sparsa, vedana, samjna, cetana]
  ordered: true
  summary_zh: 百法五十一心所的第一位：任何一念心生起時必定具有的五個心所。次序依《大乘百法明門論》：作意、觸、受、想、思（《成唯識論》作觸、作意、受、想、思）。
  summary_en: The first of the six categories of the 51 mental factors — the five present in every moment of mind. Order follows the Hundred Dharmas treatise (attention, contact, feeling, perception, volition); the Cheng weishi lun lists contact first.

- id: foundations
  zh: 基本概念
  en: Foundational Concepts
  items: [citta, caitasika, samskrta, pratityasamutpada, avidya, karma, hetu, pratyaya, catvarah-pratyayah, alambana, vipaka, kusala-moral, akusala, avyakrta, sasrava, anasrava, traidhatuka, mahabhuta, avijnapti, samskrta-laksana, prajnapti, dravya, atman, sattva, pudgala]
  summary_zh: 理解五蘊、心所與十二因緣所需的基礎名相。
  summary_en: Core terms needed to understand the aggregates, the mental factors and dependent origination.

- id: basics
  zh: 常用名相
  en: Basic Vocabulary
  items: [buddha, dharma, sangha, triratna, sarana, tathagata, samsara, gati, kalpa, asamkhyeya, yojana, sutra, vinaya, abhidharma, pratimoksa, gatha, bhiksu, bhiksuni, upasaka, upasika, sramana, punya, parinamana, mara, buddhaksetra]
  summary_zh: 佛、法、如來、輪迴、劫——讀佛典時處處會遇到的基本名相。
  summary_en: Buddha, Dharma, Tathāgata, saṃsāra, aeon — basic words met everywhere in Buddhist texts.

- id: viniyata
  zh: 別境心所
  en: Object-specific Mental Factors
  skt: pañca viniyatāḥ
  items: [chanda, adhimoksa, smrti, samadhi, prajna]
  ordered: true
  summary_zh: 只在緣特定對象時才生起的五個心所：欲（所樂境）、勝解（決定境）、念（曾習境）、定與慧（所觀境）。
  summary_en: 'Five factors that arise only with particular kinds of object: aspiration (desired), resolve (ascertained), mindfulness (familiar), concentration and wisdom (observed).'

- id: kusala
  zh: 善心所
  en: The Eleven Wholesome Mental Factors
  skt: ekādaśa kuśalāḥ
  items: [sraddha, virya, hri, apatrapya, alobha, advesa, amoha, prasrabdhi, apramada, upeksa, avihimsa]
  ordered: true
  summary_zh: 唯在善心中生起的十一個心所，各有所對治的煩惱。其中不放逸、行捨、不害是依他法假立。
  summary_en: The eleven factors found only in wholesome minds, each counteracting an affliction. Conscientiousness, equanimity and non-harming are designated on other factors.

- id: klesa
  zh: 根本煩惱
  en: The Six Root Afflictions
  skt: ṣaṭ kleśāḥ
  items: [raga, pratigha, mana, avidya, vicikitsa, drsti]
  ordered: true
  summary_zh: 貪、瞋、慢、無明（癡）、疑、不正見（惡見）——一切煩惱的根本，隨煩惱皆由此分出。
  summary_en: Greed, aversion, pride, ignorance, doubt and wrong view — the roots from which the secondary afflictions derive.

- id: upaklesa
  zh: 隨煩惱
  en: The Twenty Secondary Afflictions
  skt: viṃśatir upakleśāḥ
  items: [krodha, upanaha, pradasa, mraksa, maya, sathya, mada, vihimsa, irsya, matsarya, ahrikya, anapatrapya, asraddhya, kausidya, pramada, styana, auddhatya, musitasmrtita, asamprajanya, viksepa]
  ordered: true
  summary_zh: 根本煩惱的分位或等流。小隨十（各別起）、中隨二（遍不善心）、大隨八（遍一切染心）。
  summary_en: 'Phases or outflows of the root afflictions: ten minor (arising separately), two intermediate (in every unwholesome mind), eight major (in every defiled mind).'

- id: aniyata
  zh: 不定心所
  en: The Four Indeterminate Mental Factors
  skt: catvāro 'niyatāḥ
  items: [kaukrtya, middha, vitarka, vicara]
  ordered: true
  summary_zh: 惡作（悔）、睡眠、尋、伺——善、惡、無記不定，隨所伴隨的心而定其性質。
  summary_en: Regret, sleep, initial inquiry and sustained investigation — their moral quality depends on the mind they accompany.

- id: twelve-links
  zh: 十二因緣
  en: The Twelve Links of Dependent Origination
  skt: dvādaśāṅga pratītyasamutpāda
  head: pratityasamutpada
  items: [avidya, samskara, vijnana, namarupa, sadayatana, sparsa, vedana, trsna, upadana, bhava, jati, jaramarana]
  ordered: true
  summary_zh: 無明緣行、行緣識……生緣老死：緣起法則應用於有情生死流轉的十二個環節。
  summary_en: Ignorance conditions formations … birth conditions ageing-and-death — dependent origination applied to the cycle of rebirth in twelve links.

- id: three-seals
  zh: 三法印
  en: The Three Seals of the Dharma
  items: [anitya, anatman, nirvana]
  ordered: true
  summary_zh: 諸行無常、諸法無我、涅槃寂靜——判別是否為佛法的三個標準。
  summary_en: All conditioned things are impermanent, all dharmas are non-self, nirvāṇa is peace — the three marks of genuine Dharma.

- id: three-trainings
  zh: 三學
  en: The Three Trainings
  items: [sila, samadhi, prajna]
  ordered: true
  summary_zh: 戒、定、慧：因戒生定，因定發慧。
  summary_en: Morality, concentration, wisdom — from morality comes concentration, from concentration wisdom.

- id: six-paramitas
  zh: 六度
  en: The Six Perfections
  skt: ṣaṭ pāramitāḥ
  head: paramita
  items: [dana, sila, ksanti, virya, dhyana, prajna]
  ordered: true
  summary_zh: 布施、持戒、忍辱、精進、禪定、般若——菩薩到彼岸的六種修行。
  summary_en: Giving, morality, patience, diligence, meditation, wisdom — the six practices by which bodhisattvas cross to the other shore.

- id: four-immeasurables
  zh: 四無量心
  en: The Four Immeasurables
  skt: catvāry apramāṇāni
  head: apramana
  items: [maitri, karuna, mudita, upeksa]
  ordered: true
  summary_zh: 慈、悲、喜、捨，遍緣無量眾生的四種心。
  summary_en: Loving-kindness, compassion, sympathetic joy and equanimity, extended to immeasurable beings.

- id: twelve-ayatana
  zh: 十二處
  en: The Twelve Sense Bases
  skt: dvādaśāyatanāni
  head: ayatana
  items: [caksus, srotra, ghrana, jihva, kaya, manas, rupayatana, sabda, gandha, rasa, sprastavya, dharmayatana]
  ordered: true
  summary_zh: 六根（眼耳鼻舌身意）與六境（色聲香味觸法）——「一切」的內容。
  summary_en: The six faculties and six objects — what the Buddha called "the All".

- id: eighteen-dhatu
  zh: 十八界
  en: The Eighteen Elements
  skt: aṣṭādaśa dhātavaḥ
  head: dhatu
  items: [caksus, rupayatana, caksur-vijnana, srotra, sabda, srotra-vijnana, ghrana, gandha, ghrana-vijnana, jihva, rasa, jihva-vijnana, kaya, sprastavya, kaya-vijnana, manas, dharmayatana, mano-vijnana]
  ordered: true
  summary_zh: 六根、六境、六識，各持自性，說明認識過程中沒有作者之「我」。
  summary_en: Six faculties, six objects, six consciousnesses — each holding its own nature, showing no acting self in cognition.

- id: eight-consciousnesses
  zh: 八識
  en: The Eight Consciousnesses
  skt: aṣṭau vijñānāni
  items: [caksur-vijnana, srotra-vijnana, ghrana-vijnana, jihva-vijnana, kaya-vijnana, mano-vijnana, klista-manas, alaya-vijnana]
  ordered: true
  summary_zh: 唯識學的心法：前五識、第六意識、第七末那識、第八阿賴耶識——三能變。
  summary_en: The Yogācāra mind dharmas — five sense consciousnesses, mental consciousness, manas and the ālaya — the three transformations.

- id: practice
  zh: 修行要目
  en: Practice
  items: [samatha, vipasyana, smrtyupasthana, nivarana, klesa, anusaya]
  summary_zh: 止觀、四念處、五蓋與煩惱、隨眠——修行中最常遇到的名相。
  summary_en: Calm and insight, the foundations of mindfulness, the hindrances, afflictions and latent tendencies.

- id: stages
  zh: 三乘與四果
  en: Vehicles and Fruits
  items: [sravaka, pratyekabuddha, srotaapanna, sakrdagamin, anagamin, arhat]
  summary_zh: 聲聞、緣覺，以及須陀洹、斯陀含、阿那含、阿羅漢四果。
  summary_en: Disciples and solitary buddhas, and the four fruits from stream-entry to arhatship.

- id: asamskrta-viprayukta
  zh: 不相應行與無為
  en: Non-associated Formations and the Unconditioned
  items: [viprayukta-samskara, prapti, jivitendriya, asamjni-samapatti, nirodha-samapatti, asamskrta, akasa, pratisamkhya-nirodha, apratisamkhya-nirodha]
  summary_zh: 百法中既非色、非心、非心所的不相應行（選），以及六無為中的主要幾種。
  summary_en: Selected non-associated formations — neither matter, mind nor mental factor — and the main unconditioned dharmas.

- id: yogacara-core
  zh: 唯識要義
  en: Yogācāra Essentials
  items: [vijnaptimatra, parikalpita, paratantra, parinispanna, nihsvabhava, bija, vasana, klesavarana, jneyavarana, pudgala-nairatmya, dharma-nairatmya, tathata, asraya-paravrtti]
  summary_zh: 唯識無境、三自性與三無性、種子習氣、二障二無我、真如與轉依。
  summary_en: Consciousness-only, the three natures and non-natures, seeds and habit energy, the two obstructions and selflessnesses, suchness and transformation of the basis.

- id: mahayana-core
  zh: 大乘要義
  en: Mahāyāna Essentials
  items: [sunyata, samvrti-satya, paramartha-satya, tathagatagarbha, bodhicitta, bodhisattva, bodhi, upaya]
  summary_zh: 空、二諦、如來藏、菩提心、菩薩、菩提、方便。
  summary_en: Emptiness, the two truths, buddha-nature, the awakening mind, bodhisattva, awakening, skilful means.

- id: three-bodies
  zh: 佛之三身
  en: The Three Bodies of a Buddha
  items: [dharmakaya, sambhogakaya, nirmanakaya]
  ordered: true
  summary_zh: 法身（自性身）、報身（受用身）、化身（變化身）。
  summary_en: Dharma body (intrinsic), enjoyment body, emanation body.

- id: basics-3
  zh: 常用名相（三）
  en: Basic Vocabulary (3)
  items: [prthagjana, saiksa, asaiksa, samyojana, lokadhatu, stupa, mantra, dharani]
  summary_zh: 凡夫與有學、無學，三結與十結，三千大千世界，塔、咒與陀羅尼。
  summary_en: Ordinary beings, trainees and adepts, the fetters, the world-system, stūpas, mantras and dhāraṇīs.

- id: six-destinies
  zh: 六道
  en: The Six Destinies
  skt: ṣaḍ gatayaḥ
  head: gati
  items: [deva, manusya, asura, tiryagyoni, preta, naraka]
  ordered: true
  summary_zh: 天、人、阿修羅、畜生、餓鬼、地獄。有部只立五趣，阿修羅分屬天、鬼。
  summary_en: Gods, humans, asuras, animals, hungry ghosts and hell beings. The Sarvāstivāda counts five, filing asuras under gods or ghosts.

- id: buddhas-bodhisattvas
  zh: 佛、菩薩與淨土
  en: Buddhas, Bodhisattvas and the Pure Land
  items: [sakyamuni, amitabha, sukhavati, maitreya, manjusri, avalokitesvara, ksitigarbha]
  summary_zh: 釋迦牟尼、阿彌陀與極樂世界，以及彌勒、文殊、觀世音、地藏四大菩薩。
  summary_en: Śākyamuni, Amitābha and the Land of Bliss, and the bodhisattvas Maitreya, Mañjuśrī, Avalokiteśvara and Kṣitigarbha.

- id: three-realms
  zh: 三界
  en: The Three Realms
  head: traidhatuka
  items: [kamadhatu, rupadhatu, arupyadhatu]
  ordered: true
  summary_zh: 欲界、色界、無色界——有情生死流轉的三個層次。
  summary_en: The desire, form and formless realms — the three levels of existence in saṃsāra.

- id: four-formless
  zh: 四無色處
  en: The Four Formless Spheres
  skt: catvāra ārūpyāḥ
  items: [akasanantyayatana, vijnananantyayatana, akincanyayatana, naivasamjnanasamjnayatana]
  ordered: true
  summary_zh: 空無邊處、識無邊處、無所有處、非想非非想處——既是四種定，也是無色界的四種生處。
  summary_en: Infinite space, infinite consciousness, nothingness, neither perception nor non-perception — four attainments and the four births of the formless realm.

- id: meditation-terms
  zh: 禪定名相
  en: Meditation Terms
  items: [samapatti, priti, sukha]
  summary_zh: 等至，以及禪支中的喜與樂。
  summary_en: Meditative attainment, and the dhyāna factors rapture and pleasure.

- id: seven-bodhyanga
  zh: 七覺支
  en: The Seven Factors of Awakening
  skt: sapta bodhyaṅgāni
  head: bodhyanga
  items: [smrti, dharmapravicaya, virya, priti, prasrabdhi, samadhi, upeksa]
  ordered: true
  summary_zh: 念、擇法、精進、喜、輕安、定、捨。昏沉時修擇法、精進、喜；掉舉時修輕安、定、捨。
  summary_en: Mindfulness, investigation, energy, rapture, pliancy, concentration, equanimity. Rouse a sluggish mind with the second three; settle a restless one with the last three.

- id: awakening-aids
  zh: 道品（選）
  en: Aids to Awakening (selection)
  items: [smrtyupasthana, samyakprahana, rddhipada, bala]
  ordered: true
  summary_zh: 四念處、四正勤、四神足、五根五力。
  summary_en: The foundations of mindfulness, right efforts, bases of power, and the faculties and powers.

- id: five-powers
  zh: 五根與五力
  en: The Five Faculties and Powers
  skt: pañca balāni
  head: bala
  items: [sraddha, virya, smrti, samadhi, prajna]
  ordered: true
  summary_zh: 信、精進、念、定、慧：增上時稱根，堅固不被摧伏時稱力。
  summary_en: Faith, energy, mindfulness, concentration, wisdom — called faculties when dominant, powers when unshakeable.

- id: four-samgraha
  zh: 四攝法
  en: The Four Means of Attraction
  skt: catvāri saṃgrahavastūni
  head: samgrahavastu
  items: [dana, priyavacana, arthacarya, samanarthata]
  ordered: true
  summary_zh: 布施、愛語、利行、同事——菩薩攝受眾生的方法。
  summary_en: Giving, kind speech, beneficial action and sharing aims — how bodhisattvas draw beings in.

- id: ten-paramitas
  zh: 十波羅蜜
  en: The Ten Perfections
  skt: daśa pāramitāḥ
  items: [dana, sila, ksanti, virya, dhyana, prajna, upaya, pranidhana, bala, jnana]
  ordered: true
  summary_zh: 六度加方便、願、力、智。唯識以十度配十地。
  summary_en: The six perfections plus skilful means, vow, power and wisdom (jñāna); Yogācāra matches them to the ten stages.

- id: mahayana-core-2
  zh: 大乘要義（二）
  en: Mahāyāna Essentials (2)
  items: [svabhava, prapanca, dharmadhatu, dharmata, sarvajnata, mahayana, ekayana, bhumi, anutpattika-dharma-ksanti]
  summary_zh: 自性與戲論、法界與法性、一切智、大乘與一佛乘、十地與無生法忍。
  summary_en: Intrinsic nature and proliferation, dharma-realm and dharma-nature, omniscience, the Great and One Vehicles, the bodhisattva stages and acceptance of non-arising.

- id: five-views
  zh: 五見
  en: The Five Views
  skt: pañca dṛṣṭayaḥ
  head: drsti
  items: [satkaya-drsti, antagraha-drsti, mithya-drsti, drsti-paramarsa, silavrata-paramarsa]
  ordered: true
  summary_zh: 根本煩惱「惡見」的五種：薩迦耶見、邊執見、邪見、見取見、戒禁取見。
  summary_en: 'The five kinds of the root affliction "wrong view": personality view, extreme view, false view, attachment to views, attachment to rules and rituals.'

- id: manas-four
  zh: 末那四惑
  en: The Four Afflictions of Manas
  items: [atma-moha, atma-drsti, atma-mana, atma-sneha]
  ordered: true
  summary_zh: 第七末那識恆與我癡、我見、我慢、我愛四根本煩惱相應。
  summary_en: Manas is always joined with self-delusion, self-view, self-pride and self-love.

- id: yogacara-core-2
  zh: 唯識要義（二）
  en: Yogācāra Essentials (2)
  items: [parinama, samudacara, grahya-grahaka, atma-graha, dharma-graha, adana-vijnana, gotra, icchantika]
  summary_zh: 識變、現行、二取、我執法執、阿陀那識、種姓與一闡提。
  summary_en: Transformation of consciousness, manifestation, grasper and grasped, the two graspings, the appropriating consciousness, lineage and the icchantika.

- id: four-parts
  zh: 心識四分
  en: The Four Parts of Consciousness
  items: [nimitta-bhaga, darsana-bhaga, svasamvitti-bhaga, svasamvitti-samvitti-bhaga]
  ordered: true
  summary_zh: 護法所立：相分、見分、自證分、證自證分。
  summary_en: Dharmapāla's four parts — image, seeing, self-witnessing, and the witness of self-witnessing.

- id: pramana
  zh: 量
  en: Valid Cognition
  head: pramana
  items: [pratyaksa, anumana]
  ordered: true
  summary_zh: 陳那因明只立現量與比量；唯識另說非量，合為三量。
  summary_en: Dignāga's logic accepts only perception and inference; Yogācāra adds invalid cognition to make three.

- id: four-conditions
  zh: 四緣
  en: The Four Conditions
  head: catvarah-pratyayah
  items: [hetupratyaya, samanantara-pratyaya, alambana-pratyaya, adhipati-pratyaya]
  ordered: true
  summary_zh: 因緣、等無間緣、所緣緣、增上緣。心法四緣具足，色法只需因緣與增上緣。
  summary_en: Causal, immediately preceding, object and dominant conditions. Minds need all four; matter only the first and last.

- id: five-results
  zh: 五果
  en: The Five Results
  head: phala
  items: [vipaka-phala, nisyanda-phala, visamyoga-phala, purusakara-phala, adhipati-phala]
  ordered: true
  summary_zh: 異熟、等流、離繫、士用、增上（依《成唯識論》次序）。
  summary_en: Ripened, outflow, separation, agent-made and dominant (in the Cheng weishi lun's order).

- id: viprayukta-2
  zh: 心不相應行（二）
  en: Non-associated Formations (2)
  items: [nikaya-sabhaga, prthagjanatva, asamjnika, nama-kaya, pada-kaya, vyanjana-kaya]
  summary_zh: 眾同分、異生性、無想報，以及名身、句身、文身。
  summary_en: Commonality of a class, ordinariness, the state of non-perception, and words, phrases and letters.

- id: six-asamskrta
  zh: 六無為
  en: The Six Unconditioned Dharmas
  skt: ṣaḍ asaṃskṛtāni
  head: asamskrta
  items: [akasa, pratisamkhya-nirodha, apratisamkhya-nirodha, aninjya, samjnavedita-nirodha, tathata]
  ordered: true
  summary_zh: 虛空、擇滅、非擇滅、不動滅、想受滅、真如——唯識說六者皆依真如假立。
  summary_en: Space, the two cessations, imperturbability, cessation of perception and feeling, and suchness — all designated on suchness in Yogācāra.

- id: five-stages
  zh: 唯識五位
  en: The Five Stages of Yogācāra
  items: [sambhara-avastha, prayoga-avastha, darsana-marga, bhavana-marga, nistha-avastha]
  ordered: true
  summary_zh: 資糧、加行、通達（見道）、修習（修道）、究竟——悟入唯識的五個階位。
  summary_en: Accumulation, preparation, penetration (seeing), cultivation and culmination — the five stages of entering consciousness-only.

- id: four-wisdoms
  zh: 四智
  en: The Four Wisdoms
  head: jnana
  items: [adarsa-jnana, samata-jnana, pratyaveksana-jnana, krtyanusthana-jnana]
  ordered: true
