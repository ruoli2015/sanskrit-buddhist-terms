id: avidya-drsti-asamprajanya
title_zh: 迷與錯：無明（癡）、惡見、疑、不正知與慧
title_en: Not knowing and knowing wrongly — ignorance, wrong view, doubt, non-alertness and wisdom
terms: [ avidya, drsti, vicikitsa, asamprajanya, prajna ]
summary_zh: 無明是「迷闇」（不明）；惡見是「染慧」（錯誤推度）；疑是「猶豫」（不能決定）；不正知是對當下行為的「謬解」。它們都與「知」有關，但病根不同；慧本身則通善惡。
summary_en: Ignorance is darkness (not seeing); wrong view is defiled discernment (reasoning wrongly); doubt is vacillation (not deciding); non-alertness is misreading present conduct. All concern knowing, with different pathologies; prajñā itself can go either way.
