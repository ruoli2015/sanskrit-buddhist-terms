id: five-stages
title_zh: 唯識五位
title_en: The five stages of the Yogācāra path
terms: [ sambhara-avastha, prayoga-avastha, darsana-marga, bhavana-marga, nistha-avastha, bhumi ]
summary_zh: 資糧位積集福智；加行位伏二取；通達位（見道）初證真如；修習位（修道）歷十地斷俱生障；究竟位成佛。《唯識三十頌》後五頌依次說此五位。
summary_en: Accumulation gathers merit and wisdom; preparation subdues the two graspings; penetration (seeing) first realizes suchness; cultivation removes the innate obstructions through the ten stages; culmination is buddhahood. The last five of the Thirty Verses describe them in order.
