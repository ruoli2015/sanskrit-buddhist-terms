id: four-parts
title_zh: 四分：相分、見分、自證分、證自證分
title_en: 'The four parts: image, seeing, self-witnessing, witness of self-witnessing'
terms: [ nimitta-bhaga, darsana-bhaga, svasamvitti-bhaga, svasamvitti-samvitti-bhaga ]
summary_zh: 護法說一念心識有四分：被認識的影像（相分）、能認識的作用（見分）、二者所依的識體並證知見分（自證分）、證知自證分（證自證分）。
summary_en: Dharmapāla analyses each moment of consciousness into four parts — the image known, the seeing that knows it, the substance that witnesses the seeing, and the witness of that witnessing.
table:
  columns:
    - { zh: 相分, en: Image }
    - { zh: 見分, en: Seeing }
    - { zh: 自證分, en: Self-witnessing }
    - { zh: 證自證分, en: Witness of it }
  rows:
    - label: { zh: 所緣, en: Takes as object }
      cells:
        - { zh: —（唯所緣）, en: — (only an object) }
        - { zh: 相分, en: Image part }
        - { zh: 見分、證自證分, en: Seeing part and fourth part }
        - { zh: 自證分, en: Self-witnessing part }
    - label: { zh: 量, en: Cognition }
      cells:
        - { zh: —, en: — }
        - { zh: 或量非量，或現或比, en: 'Valid or not; perceptual or inferential' }
        - { zh: 唯現量, en: Perception only }
        - { zh: 唯現量, en: Perception only }
    - label: { zh: 內外, en: Inner or outer }
      cells:
