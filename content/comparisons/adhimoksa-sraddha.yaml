id: adhimoksa-sraddha
title_zh: 勝解（adhimokṣa）與信（śraddhā）
title_en: Resolve vs. faith (adhimokṣa & śraddhā)
terms: [ adhimoksa, sraddha ]
summary_zh: 勝解是認知上的「印持確定」，可正可邪；信是以「心淨」為性的善心所，對實、德、能深忍樂欲。英譯都可能作 conviction，但體性完全不同。
summary_en: Resolve is cognitive "sealing" certainty, which may be right or wrong; faith is a wholesome factor whose nature is clarity of mind, accepting and delighting in the real, virtuous and capable. Both get translated "conviction", yet they differ entirely.
table:
  columns:
    - { zh: 勝解 adhimokṣa, en: Resolve }
    - { zh: 信 śraddhā, en: Faith }
  rows:
    - label: { zh: 類別, en: Category }
      cells:
        - { zh: 別境心所, en: Object-specific }
        - { zh: 善心所, en: Wholesome }
    - label: { zh: 體性, en: Nature }
      cells:
        - { zh: 於決定境印持, en: Confirming an ascertained object }
        - { zh: 深忍、樂、欲，心淨, en: 'Acceptance, delight, aspiration; clarity' }
    - label: { zh: 作用, en: Function }
      cells:
        - { zh: 不可引轉, en: Cannot be swayed }
        - { zh: 對治不信，樂善, en: Counters faithlessness; delights in good }
    - label: { zh: 可否錯誤, en: Can it be wrong? }
      cells:
        - { zh: 可以——邪勝解, en: Yes — wrong resolve }
        - { zh: 不會——信必是善, en: No — faith is always wholesome }
    - label: { zh: 相反, en: Opposite }
