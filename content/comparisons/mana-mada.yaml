id: mana-mada
title_zh: 慢（māna）與憍（mada）
title_en: Pride vs. haughtiness (māna & mada)
terms: [ mana, mada ]
summary_zh: 慢是「和別人比」而高舉（根本煩惱，以比較為核心）；憍是對自己的盛事陶醉（隨煩惱，貪的一分），不必比較。
summary_en: Pride exalts oneself by comparison with others (a root affliction); haughtiness is intoxication with one's own fortune (a secondary affliction, part of greed), needing no comparison.
table:
  columns:
    - { zh: 慢 māna, en: Pride }
    - { zh: 憍 mada, en: Haughtiness }
