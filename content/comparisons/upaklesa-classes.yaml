id: upaklesa-classes
title_zh: 隨煩惱的三類與假實
title_en: Three classes of secondary afflictions, real and designated
terms: [ krodha, ahrikya, anapatrapya, auddhatya, styana, asraddhya, kausidya, pramada, musitasmrtita, viksepa, asamprajanya ]
summary_zh: 小隨十（各別起）、中隨二（遍不善心）、大隨八（遍一切染心）。小十與大隨中的放逸、失念、不正知定是假有；無慚、無愧、不信、懈怠定是實有；掉舉、惛沈、散亂有假實二說。
summary_en: 'Ten minor (arise separately), two intermediate (in every unwholesome mind), eight major (in every defiled mind). The ten minor plus heedlessness, forgetfulness and non-alertness are definitely designated; lack of self-respect, lack of decorum, faithlessness and laziness definitely real; restlessness, torpor and distraction disputed.'
table:
  columns:
    - { zh: 小隨煩惱（10）, en: Minor (10) }
    - { zh: 中隨煩惱（2）, en: Intermediate (2) }
    - { zh: 大隨煩惱（8）, en: Major (8) }
  rows:
    - label: { zh: 成員, en: Members }
      cells:
