id: aniyata-four
title_zh: 四不定心所：悔、眠、尋、伺
title_en: The four indeterminate factors — regret, sleep, inquiry, investigation
terms: [ kaukrtya, middha, vitarka, vicara ]
summary_zh: 這四者不像遍行那樣遍一切心，不像別境那樣定遍一切地，也不固定為善或染，故名「不定」。其善惡由所伴隨的心決定。
summary_en: These four are not in every mind like the omnipresent, not in every realm like the object-specific, and not fixed as wholesome or defiled — hence "indeterminate". Their quality depends on the mind they accompany.
