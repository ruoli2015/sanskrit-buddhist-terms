explanation_zh: |
  **為何叫「不定」**：《成唯識論》：「悔、眠、尋、伺於善、染等皆不定故，非如觸等定遍心故，非如欲等定遍地故，立不定名。」三個「不」：不像遍行遍一切心，不像別境遍一切地（界地），善惡也不固定。

  **二各二**：《唯識三十頌》說「不定謂悔、眠，尋、伺二各二」。論師對「二各二」有不同解釋，一說悔眠為一組、尋伺為一組，每組又各分染淨二類。

  **修行關聯**：悔與掉舉合為「掉悔蓋」，眠與惛沈合為「惛眠蓋」；尋伺的止息則標誌從初禪進入二禪。
explanation_en: |
  **Why "indeterminate"**: Cheng weishi lun: "Regret, sleep, inquiry and investigation are not fixed as wholesome, defiled, etc.; unlike contact and the rest they are not in every mind; unlike aspiration and the rest they are not in every realm — hence indeterminate." Three "nots": not universal like the omnipresent, not in all realms like the object-specific, not fixed in moral quality.

  **"Two, each two"**: the Thirty Verses say "the indeterminate are regret and sleep, inquiry and investigation — two, each two". Commentators differ; one reading: regret-sleep and inquiry-investigation form two pairs, each further divided into defiled and pure.

  **In practice**: regret joins restlessness in the hindrance "restlessness and remorse"; sleep joins torpor in "torpor and sleep"; the stilling of inquiry and investigation marks the passage from the first to the second dhyāna.
quotes:
  - text: 悔、眠、尋、伺於善、染等皆不定故，非如觸等定遍心故，非如欲等定遍地故，立不定名。
    source: 《成唯識論》卷7
    source_en: Cheng weishi lun, fasc. 7
    ref: T31n1585_p0035c09
    refEnd: T31n1585_p0035c11
    note_en: Regret, sleep, inquiry and investigation are not fixed as wholesome, defiled, etc.; unlike contact and the rest they are not certainly in every mind, and unlike aspiration and the rest they are not certainly in every realm — hence they are called indeterminate.
questions:
  - type: mcq
    q_zh: 下列哪一個不是不定心所？
    q_en: Which is NOT an indeterminate factor?
    options:
      - { zh: 惡作, en: regret }
      - { zh: 睡眠, en: sleep }
      - { zh: 惛沈, en: torpor }
      - { zh: 伺, en: investigation }
    answer: 2
    explain_zh: 惛沈是大隨煩惱。四不定：悔、眠、尋、伺。
    explain_en: Torpor is a major secondary affliction. The four indeterminate are regret, sleep, inquiry, investigation.
  - type: tf
    q_zh: 後悔自己做了壞事，這種「悔」是善的。
    q_en: Regretting a wrong one has done is wholesome regret.
    answer: true
    explain_zh: 悔的善惡由所悔之事決定；悔惡是善。
    explain_en: Regret takes its quality from what is regretted; regretting evil is wholesome.
  - type: mcq
    q_zh: 惡作（悔）的「業」是？
    q_en: What is the function of regret?
    options:
      - { zh: 障觀, en: obstructing insight }
      - { zh: 障止, en: obstructing calm }
      - { zh: 定依, en: supporting concentration }
      - { zh: 生苦, en: producing suffering }
    answer: 1
    explain_zh: 「悔謂惡作……追悔為性，障止為業。」眠則「障觀為業」。
    explain_en: Regret "obstructs calm"; sleep "obstructs insight".
  - type: mcq
    q_zh: 「不定」的理由不包括下列哪一項？
    q_en: Which is NOT a reason these factors are called indeterminate?
    options:
      - { zh: 善染不定, en: not fixed as wholesome or defiled }
      - { zh: 不遍一切心, en: not in every mind }
      - { zh: 不遍一切地, en: not in every realm }
      - { zh: 只在夢中出現, en: they occur only in dreams }
    answer: 3
    explain_zh: 論中列出的是前三點。
    explain_en: The treatise gives the first three reasons.
