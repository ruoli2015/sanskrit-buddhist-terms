id: samskara-cetana
title_zh: 行（saṃskāra）與思（cetanā）——「行」字的三義
title_en: Saṃskāra vs. cetanā — and the three senses of 行
terms: [samskara, cetana, samskrta, karma]
summary_zh: 思是行蘊中「最勝」的一個心所，但行蘊不等於思；十二因緣的「行」是思所發動的業；「諸行」則是一切有為法。
summary_en: Volition is the foremost single factor within the formations aggregate, but the aggregate is not volition; the saṃskāra of the twelve links is karma set in motion by volition; "all saṃskāras" means all conditioned things.
