id: mraksa-maya-sathya
title_zh: 覆、誑、諂：三種欺瞞
title_en: Concealment, deceit, guile — three kinds of deception
terms: [ mraksa, maya, sathya ]
summary_zh: 覆是藏起自己「有」的過失；誑是假裝自己「有」其實沒有的德行；諂是為了籠絡他人而扭曲自己、曲意逢迎。三者皆以貪、癡為體。
summary_en: Concealment hides faults one has; deceit feigns virtues one lacks; guile twists oneself to ensnare others. All three are parts of greed and delusion.
