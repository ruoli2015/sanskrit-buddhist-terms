  columns:
    - { zh: 覆 mrakṣa, en: Concealment }
    - { zh: 誑 māyā, en: Deceit }
    - { zh: 諂 śāṭhya, en: Guile }
  rows:
    - label: { zh: 欺瞞什麼, en: What is falsified }
