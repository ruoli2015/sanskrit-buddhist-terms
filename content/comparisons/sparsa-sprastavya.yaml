id: sparsa-sprastavya
title_zh: 觸心所（sparśa）與觸境（spraṣṭavya）
title_en: Contact (sparśa) vs. the tangible (spraṣṭavya)
terms: [ sparsa, sprastavya ]
summary_zh: 兩者漢譯都是「觸」：觸心所是根、境、識三和合的心理作用（行蘊）；觸境是身根所觸的對象，是色法（色蘊）。
summary_en: 'Both are 觸 in Chinese: contact is the mental factor of faculty, object and consciousness meeting (formations aggregate); the tangible is the object of the body faculty, a form of matter (form aggregate).'
table:
  columns:
    - { zh: 觸心所 sparśa, en: Contact }
    - { zh: 觸境 spraṣṭavya, en: Tangible }
  rows:
