id: manas-three
title_zh: 意、意識、末那識
title_en: Manas, mental consciousness and the seventh consciousness
terms: [ manas, mano-vijnana, klista-manas, alaya-vijnana ]
summary_zh: 「意」是意根（第六識的所依）；「意識」是依意根而起的第六識；「末那識」是恆緣阿賴耶識執以為我的第七識——唯識以末那為意根。
summary_en: Manas is the mental faculty (support of the sixth consciousness); mano-vijñāna is the sixth consciousness based on it; kliṣṭa-manas is the seventh, which constantly grasps the ālaya as self — Yogācāra identifies it as the mental faculty.
