id: smrti-musitasmrtita
title_zh: 念、正念與失念
title_en: Mindfulness, right mindfulness and forgetfulness
terms: [ smrti, musitasmrtita ]
summary_zh: 念是別境心所，明記曾習之境；「不忘念即是正念」；與煩惱相應、忘失所緣的則是隨煩惱「失念」（被偷走的念）。
summary_en: Mindfulness is an object-specific factor that clearly keeps familiar objects in mind; "non-forgetful mindfulness is right mindfulness"; mindfulness bound up with afflictions, losing its object, is the secondary affliction "forgetfulness" (stolen mindfulness).
