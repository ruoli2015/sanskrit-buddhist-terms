id: apramada-virya
title_zh: 不放逸與精進；放逸與懈怠
title_en: Conscientiousness vs. diligence; heedlessness vs. laziness
terms: [ apramada, virya, pramada, kausidya ]
summary_zh: 精進與懈怠是實有的心所；不放逸與放逸則是「組合」出來的：不放逸＝精進＋三善根（防惡修善），放逸＝懈怠＋貪瞋癡（不防不修）。
summary_en: Diligence and laziness are real factors; conscientiousness and heedlessness are "composites" — conscientiousness = diligence + the three wholesome roots (guarding and cultivating), heedlessness = laziness + greed, hatred, delusion (neither guarding nor cultivating).
