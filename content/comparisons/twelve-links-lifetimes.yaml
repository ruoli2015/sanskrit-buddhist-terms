id: twelve-links-lifetimes
title_zh: 十二因緣的三世兩重因果
title_en: The twelve links across three lives — two layers of cause and effect
terms: [ avidya, samskara, vijnana, namarupa, sadayatana, sparsa, vedana, trsna, upadana, bhava, jati, jaramarana ]
summary_zh: 說一切有部把十二支分配到過去、現在、未來三世：過去二因（無明、行）→ 現在五果（識至受）→ 現在三因（愛、取、有）→ 未來二果（生、老死）。
summary_en: 'The Sarvāstivāda distributes the twelve links over three lives: two past causes (ignorance, formations) → five present effects (consciousness to feeling) → three present causes (craving, clinging, becoming) → two future effects (birth, ageing-and-death).'
table:
  columns:
