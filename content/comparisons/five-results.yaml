id: five-results
title_zh: 五果：異熟、等流、離繫、士用、增上
title_en: 'The five results: ripened, outflow, separation, agent-made, dominant'
terms: [ phala, vipaka-phala, nisyanda-phala, visamyoga-phala, purusakara-phala, adhipati-phala ]
summary_zh: 異熟果性質與因不同（無記）；等流果與因同類；離繫果是斷障所顯的無為；士用果是作者以工具所成；增上果是其餘一切果。
summary_en: The ripened result differs in quality from its cause (neutral); the outflow result is of the same kind; the separation result is the unconditioned revealed by cutting obstructions; the agent-made result is what an agent makes with tools; the dominant result is all the rest.
