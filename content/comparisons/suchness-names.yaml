id: suchness-names
title_zh: 真如、法性、法界
title_en: Suchness, dharma-nature and dharma-realm
terms: [ tathata, dharmata, dharmadhatu, parinispanna ]
summary_zh: 三者在大乘中多指同一實相：真如強調「真實如常」，法性強調「法的本性」，法界強調「聖法之因、諸法之性」。但「法界」在十八界中另有狹義。
summary_en: In Mahāyāna all three usually name the same reality — suchness stresses "true and unchanging", dharma-nature "the nature of dharmas", dharma-realm "the source of noble qualities, the nature of things". But dharma-realm also has a narrow sense among the eighteen elements.
table:
  columns:
    - { zh: 真如, en: Suchness }
    - { zh: 法性, en: Dharma-nature }
    - { zh: 法界, en: Dharma-realm }
