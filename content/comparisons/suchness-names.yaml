        - { zh: 真實、如常不變, en: True and unchanging }
        - { zh: 諸法本來如此, en: Things naturally being so }
        - { zh: 聖法之因、法的範圍, en: Source of noble qualities }
    - label: { zh: 狹義, en: Narrow sense }
      cells:
