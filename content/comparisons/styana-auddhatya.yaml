id: styana-auddhatya
title_zh: 惛沈、掉舉與睡眠——禪修的兩大障礙
title_en: Torpor, restlessness and sleep — the two great obstacles in meditation
terms: [ styana, auddhatya, middha, prasrabdhi, upeksa, viksepa ]
summary_zh: 惛沈令心下沉，障輕安與「觀」；掉舉令心上浮，障行捨與「止」。睡眠是身不自在、心昧略的狀態（不定心所），散亂則是在對象間流蕩。
summary_en: Torpor makes the mind sink, obstructing pliancy and insight; restlessness makes it float, obstructing equanimity and calm. Sleep is a dim, contracted state (indeterminate); distraction is drifting between objects.
