id: pratigha-family
title_zh: 瞋的五種分位：忿、恨、惱、嫉、害
title_en: Five faces of aversion — wrath, resentment, spite, jealousy, harmfulness
terms: [ pratigha, krodha, upanaha, pradasa, irsya, vihimsa ]
summary_zh: 忿、恨、惱、嫉、害都「以瞋恚一分為體」，沒有獨立實體，是瞋在不同情境下的表現：當下爆發、事後積怨、惡言螫人、見人好而妒、無悲而損惱。
summary_en: Wrath, resentment, spite, jealousy and harmfulness all "have a part of aversion as substance" — no separate entity, just aversion in different situations — erupting now, festering later, stinging with words, begrudging others' success, tormenting without compassion.
