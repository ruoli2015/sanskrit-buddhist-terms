      cells:
        - { zh: 有為法親辦自果, en: A conditioned dharma directly producing its own result }
        - { zh: 前念心心所等而開導，令後念定生, en: 'The prior mind opens the way for the next' }
        - { zh: 帶己相心所慮所託, en: What the mind cognizes and rests on }
        - { zh: 有勝勢用，於餘法或順或違, en: Power to aid or hinder other dharmas }
