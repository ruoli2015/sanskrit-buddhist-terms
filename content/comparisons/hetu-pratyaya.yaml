id: hetu-pratyaya
title_zh: 因與緣；四緣
title_en: Cause and condition; the four conditions
terms: [ hetu, pratyaya, catvarah-pratyayah, alambana ]
summary_zh: 因是親生果的主因，緣是助成的條件（廣義的緣包括因）。四緣：因緣（親辦自果）、等無間緣（前念開導後念）、所緣緣（所認識的對象）、增上緣（其他一切助力或阻力）。
summary_en: 'A cause directly produces its result; conditions assist (broadly, conditions include the cause). The four: causal (directly producing), immediately preceding (the prior mind opening the way), object (what is cognized), dominant (every other aid or hindrance).'
table:
  columns:
    - { zh: 因緣, en: Causal }
    - { zh: 等無間緣, en: Immediately preceding }
    - { zh: 所緣緣, en: Object }
    - { zh: 增上緣, en: Dominant }
  rows:
